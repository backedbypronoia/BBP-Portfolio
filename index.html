<style>
:root{--cream:#F1E3C2;--gold:#D4A93C;--ink:#17121F}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2A0F57;color:var(--cream);font:14px Tahoma,"Segoe UI",Verdana,sans-serif}
.login{position:fixed;inset:0;display:grid;grid-template-rows:72px 1fr 72px}
.band{background:linear-gradient(180deg,#1A0840,#2A0F57);border-bottom:2px solid var(--gold)}
.band.b{border-bottom:0;border-top:2px solid #6E44B8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:11px;color:#CDBDEB}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);align-items:center;gap:40px;padding:0 24px;background:radial-gradient(ellipse at 30% 40%,#6A3AC0,#3E1880 60%,#2A0F57)}
.left{justify-self:end;text-align:right}
.mark{display:inline-flex;align-items:center;gap:12px;background:#4A1E8E;border:1px solid #6E44B8;border-radius:6px;padding:8px 20px 10px;box-shadow:0 10px 40px rgba(0,0,0,.5);margin-bottom:14px}
.mark span{font:900 clamp(24px,3.4vw,40px)/1 "Playfair Display",Georgia,serif;color:var(--cream);white-space:nowrap}
.mark .sp{color:var(--gold);font-size:clamp(20px,2.8vw,32px)}
.left p{margin:0;font-size:15px;color:#E5DAF7}
.divider{height:60%;background:linear-gradient(180deg,transparent,#B9A2E6,transparent)}
form{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,0));max-width:420px}
.avatar{width:64px;height:64px;flex:none;border:3px solid #fff;border-radius:6px;background:linear-gradient(135deg,#4A9268,#215239);display:grid;place-items:center;color:var(--gold);font-size:34px}
b.who{display:block;font:bold 20px "Trebuchet MS",Tahoma,sans-serif;color:#fff;margin-bottom:6px}
.pw{display:flex;gap:6px}
input{width:170px;max-width:100%;padding:4px 6px;border:1px solid #2A0F57;border-radius:3px;font:13px Tahoma,sans-serif;color:var(--ink)}
@media (max-width:640px),(pointer:coarse){input{font-size:16px;padding:6px 8px;width:190px}button{width:36px;height:34px}}
button{width:28px;height:26px;border:1px solid #fff;border-radius:4px;background:linear-gradient(180deg,#63C163,#2D6B4A);color:#fff;font-weight:bold;cursor:pointer}
small{display:block;margin-top:6px;color:#CDBDEB}
small.bad{color:#FFB4A8}
@media (max-width:640px){.mid{grid-template-columns:minmax(0,1fr);gap:24px;align-content:center}.left{justify-self:start;text-align:left}.divider{display:none}}
</style>

async function unwrap(code) {
